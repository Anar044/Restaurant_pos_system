services:
  postgres:
    image: postgres:18-alpine
    container_name: restaurant-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_local}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurant_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - restaurant_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-restaurant} -d ${POSTGRES_DB:-restaurant_local}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  restaurant_pgdata:
