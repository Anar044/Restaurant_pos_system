name: POS selected pricing runtime

on:
  push:
    branches:
      - feature/pos-selected-adjustment-items-v1

jobs:
  runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: restaurant_local
          POSTGRES_USER: restaurant
          POSTGRES_PASSWORD: restaurant_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurant -d restaurant_local"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj
      - run: dotnet build services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj --no-restore
      - name: Runtime smoke
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          cd services/restaurant-node/src/RestaurantNode.Api
          dotnet run --no-build --no-launch-profile > /tmp/node.log 2>&1 &
          PID=$!
          cd ../../../..
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8180/health >/dev/null; then
              python3 scripts/ci-pos-selected-pricing-smoke.py
              kill "$PID" || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/node.log
          exit 1
