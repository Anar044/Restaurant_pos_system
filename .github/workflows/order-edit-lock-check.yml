name: Order edit lock check

on:
  push:
    branches:
      - feature/order-edit-lock-v1

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend
        run: dotnet restore services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj

      - name: Build backend
        run: dotnet build services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj --no-restore

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        working-directory: apps/pos-template
        run: flutter pub get

      - name: Format
        working-directory: apps/pos-template
        run: dart format lib

      - name: Analyze
        working-directory: apps/pos-template
        run: flutter analyze --no-fatal-infos
