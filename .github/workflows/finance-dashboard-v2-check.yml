name: Finance dashboard v2 check

on:
  push:
    branches:
      - feature/finance-dashboard-v2

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool restore
      - run: dotnet restore services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj
      - name: Generate migration
        shell: bash
        run: |
          if ! grep -R -q 'class AddOrderOriginAttribution' services/restaurant-node/src/RestaurantNode.Api/Infrastructure/Migrations/*.cs; then
            dotnet ef migrations add AddOrderOriginAttribution \
              --project services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj \
              --startup-project services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj \
              --output-dir Infrastructure/Migrations
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/restaurant-node/src/RestaurantNode.Api/Infrastructure/Migrations
            git commit -m "Generate order origin attribution migration"
            git push
          fi
      - run: dotnet build services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj --no-restore
      - name: Verify EF model
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj \
            --startup-project services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj
      - run: dotnet test tests/RestaurantNode.Pricing.Tests/RestaurantNode.Pricing.Tests.csproj

  runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: restaurant_local
          POSTGRES_USER: restaurant
          POSTGRES_PASSWORD: restaurant_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurant -d restaurant_local"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj
      - run: dotnet build services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj --no-restore
      - name: Run finance dashboard smoke
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          cd services/restaurant-node/src/RestaurantNode.Api
          dotnet run --no-build --no-launch-profile > /tmp/restaurant-node.log 2>&1 &
          PID=$!
          cd ../../../..

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8180/health >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8180/health >/dev/null || {
            cat /tmp/restaurant-node.log
            exit 1
          }

          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8180/api/v1/auth/pin             -H 'Content-Type: application/json'             -d '{"restaurantId":"11111111-1111-1111-1111-111111111111","pin":"1234"}' |
            jq -r '.token')

          POS_A=$(curl -fsS -X POST http://127.0.0.1:8180/api/v1/backoffice/devices/terminals             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d '{"name":"CI Finance POS A","type":"POS","receiptPrinterId":null}' |
            jq -r '.id')

          POS_B=$(curl -fsS -X POST http://127.0.0.1:8180/api/v1/backoffice/devices/terminals             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d '{"name":"CI Finance POS B","type":"POS","receiptPrinterId":null}' |
            jq -r '.id')

          SHIFT_A=$(curl -fsS -X POST http://127.0.0.1:8180/api/v1/shifts/open             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d "{\"deviceId\":\"$POS_A\",\"openingCash\":50}" |
            jq -r '.id')

          SHIFT_B=$(curl -fsS -X POST http://127.0.0.1:8180/api/v1/shifts/open             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d "{\"deviceId\":\"$POS_B\",\"openingCash\":20}" |
            jq -r '.id')

          MENU=$(curl -fsS http://127.0.0.1:8180/api/v1/menu             -H "Authorization: Bearer $TOKEN")
          PRODUCT_A=$(echo "$MENU" | jq -r '.categories[0].products[0].id')
          PRODUCT_B=$(echo "$MENU" | jq -r '.categories[0].products[1].id')

          ORDER_A=$(curl -fsS -X POST http://127.0.0.1:8180/api/v1/orders             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d "{\"guestCount\":1,\"shiftId\":\"$SHIFT_A\"}")
          ORDER_A_ID=$(echo "$ORDER_A" | jq -r '.id')

          ORDER_A=$(curl -fsS -X POST "http://127.0.0.1:8180/api/v1/orders/$ORDER_A_ID/items"             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d "{\"productId\":\"$PRODUCT_A\",\"quantity\":1,\"guestNumber\":1}")
          TOTAL_A=$(echo "$ORDER_A" | jq -r '.total')

          ORDER_B=$(curl -fsS -X POST http://127.0.0.1:8180/api/v1/orders             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d "{\"guestCount\":1,\"shiftId\":\"$SHIFT_B\"}")
          ORDER_B_ID=$(echo "$ORDER_B" | jq -r '.id')

          ORDER_B=$(curl -fsS -X POST "http://127.0.0.1:8180/api/v1/orders/$ORDER_B_ID/items"             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d "{\"productId\":\"$PRODUCT_B\",\"quantity\":1,\"guestNumber\":1}")
          TOTAL_B=$(echo "$ORDER_B" | jq -r '.total')

          FROM=$(date -u -d '-2 hours' '+%Y-%m-%dT%H:%M:%SZ')
          TO=$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')

          FINANCE_A=$(curl -fsS -G http://127.0.0.1:8180/api/v1/backoffice/finance             -H "Authorization: Bearer $TOKEN"             --data-urlencode "from=$FROM"             --data-urlencode "to=$TO"             --data-urlencode "deviceIds=$POS_A"             --data-urlencode "take=100")

          test "$(echo "$FINANCE_A" | jq -r '.summary.openOrdersCount')" = "1"
          test "$(echo "$FINANCE_A" | jq -r '.summary.openOrdersAmount')" = "$TOTAL_A"
          test "$(echo "$FINANCE_A" | jq -r '.summary.openShiftsCount')" = "1"
          test "$(echo "$FINANCE_A" | jq -r '.shifts | length')" = "1"
          test "$(echo "$FINANCE_A" | jq -r '.shifts[0].deviceId')" = "$POS_A"

          DETAIL_A=$(curl -fsS -G http://127.0.0.1:8180/api/v1/backoffice/finance             -H "Authorization: Bearer $TOKEN"             --data-urlencode "from=$FROM"             --data-urlencode "to=$TO"             --data-urlencode "deviceIds=$POS_A"             --data-urlencode "shiftId=$SHIFT_A"             --data-urlencode "take=100")

          test "$(echo "$DETAIL_A" | jq -r '.selectedShiftReport.shiftId')" = "$SHIFT_A"
          test "$(echo "$DETAIL_A" | jq -r --arg id "$ORDER_A_ID" '.selectedShiftOrders | map(select(.id == $id)) | length')" = "1"
          test "$(echo "$DETAIL_A" | jq -r --arg id "$ORDER_B_ID" '.selectedShiftOrders | map(select(.id == $id)) | length')" = "0"

          FINANCE_ALL=$(curl -fsS -G http://127.0.0.1:8180/api/v1/backoffice/finance             -H "Authorization: Bearer $TOKEN"             --data-urlencode "from=$FROM"             --data-urlencode "to=$TO"             --data-urlencode "take=100")

          test "$(echo "$FINANCE_ALL" | jq -r '.summary.openOrdersCount')" = "2"
          test "$(echo "$FINANCE_ALL" | jq -r '.summary.openShiftsCount')" = "2"

          EXPECTED=$(awk "BEGIN { printf \"%.4f\", $TOTAL_A + $TOTAL_B }")
          ACTUAL=$(echo "$FINANCE_ALL" | jq -r '.summary.openOrdersAmount' | awk '{ printf "%.4f", $1 }')
          test "$ACTUAL" = "$EXPECTED"

          echo "Finance dashboard v2 runtime smoke passed."
          kill "$PID" || true

  backoffice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/backoffice/package-lock.json
      - working-directory: apps/backoffice
        run: npm ci
      - working-directory: apps/backoffice
        run: npm run build

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: apps/pos-template
        run: flutter pub get
      - working-directory: apps/pos-template
        run: dart format lib
      - working-directory: apps/pos-template
        run: flutter analyze --no-fatal-infos
