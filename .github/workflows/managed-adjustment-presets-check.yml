name: Managed adjustment presets check

on:
  push:
    branches:
      - feature/adjustment-presets-v1

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: restaurant_local
          POSTGRES_USER: restaurant
          POSTGRES_PASSWORD: restaurant_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurant -d restaurant_local"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Restore backend
        run: dotnet restore services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj

      - name: Generate managed adjustment presets migration
        shell: bash
        run: |
          if ! grep -R -q 'class AddManagedAdjustmentPresets' services/restaurant-node/src/RestaurantNode.Api/Infrastructure/Migrations/*.cs; then
            dotnet ef migrations add AddManagedAdjustmentPresets \
              --project services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj \
              --startup-project services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj \
              --output-dir Infrastructure/Migrations

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/restaurant-node/src/RestaurantNode.Api/Infrastructure/Migrations
            git commit -m "Generate managed adjustment presets migration"
            git push
          fi

      - name: Build Restaurant Node
        run: dotnet build services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj --no-restore

      - name: Verify EF model clean
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj \
            --startup-project services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj

      - name: Build POS Agent
        run: dotnet build services/pos-agent/src/PosAgent.Api/PosAgent.Api.csproj

      - name: Runtime preset security smoke
        shell: bash
        env:
          ConnectionStrings__RestaurantDb: Host=127.0.0.1;Port=5432;Database=restaurant_local;Username=restaurant;Password=restaurant_dev_password
          Jwt__Key: restaurant-pos-development-jwt-key-change-me-2026-123456789
          Seed__AdminPin: "1234"
          Agent__SharedKey: restaurant-pos-agent-local-dev-key-2026
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:8180
        run: |
          set -o pipefail
          cd services/restaurant-node/src/RestaurantNode.Api
          dotnet run --no-build --no-launch-profile > /tmp/restaurant-node.log 2>&1 &
          NODE_PID=$!

          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8180/health >/dev/null; then
              ok=1
              break
            fi
            if ! kill -0 "$NODE_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            cat /tmp/restaurant-node.log
            exit 1
          fi

          AUTH_JSON=$(curl -fsS -X POST http://127.0.0.1:8180/api/v1/auth/pin \
            -H 'Content-Type: application/json' \
            -d '{"restaurantId":"11111111-1111-1111-1111-111111111111","pin":"1234"}')
          TOKEN=$(printf '%s' "$AUTH_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')

          ADJUSTMENTS_JSON=$(curl -fsS http://127.0.0.1:8180/api/v1/backoffice/adjustments \
            -H "Authorization: Bearer $TOKEN")
          ROLE_ID=$(printf '%s' "$ADJUSTMENTS_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(r["id"] for r in d["roles"] if r["canApplyAdjustments"]))')

          PRESET_JSON=$(curl -fsS -X POST http://127.0.0.1:8180/api/v1/backoffice/adjustments \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"CI Loyalty 10%\",\"type\":\"DISCOUNT\",\"mode\":\"PERCENT\",\"scope\":\"BOTH\",\"value\":10,\"isActive\":true,\"roleIds\":[\"$ROLE_ID\"]}")
          PRESET_ID=$(printf '%s' "$PRESET_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          POS_PRESETS=$(curl -fsS http://127.0.0.1:8180/api/v1/order-adjustment-presets \
            -H "Authorization: Bearer $TOKEN")
          printf '%s' "$POS_PRESETS" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert any(p["name"]=="CI Loyalty 10%" and p["value"]==10 for p in d["presets"]), d'

          MENU_JSON=$(curl -fsS http://127.0.0.1:8180/api/v1/menu \
            -H "Authorization: Bearer $TOKEN")
          PRODUCT_ID=$(printf '%s' "$MENU_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["id"] for c in d["categories"] for p in c["products"]))')

          ORDER_JSON=$(curl -fsS -X POST http://127.0.0.1:8180/api/v1/orders \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"guestCount":1}')
          ORDER_ID=$(printf '%s' "$ORDER_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          ORDER_JSON=$(curl -fsS -X POST "http://127.0.0.1:8180/api/v1/orders/$ORDER_ID/items" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"productId\":\"$PRODUCT_ID\",\"quantity\":1,\"guestNumber\":1}")

          ORDER_JSON=$(curl -fsS -X PUT "http://127.0.0.1:8180/api/v1/orders/$ORDER_ID/discount" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"presetId\":\"$PRESET_ID\"}")

          printf '%s' "$ORDER_JSON" > /tmp/preset-order.json
          python3 - <<'PY'
          import json
          from decimal import Decimal
          with open("/tmp/preset-order.json", encoding="utf-8") as f:
              d=json.load(f)
          subtotal=Decimal(str(d["subtotal"]))
          discount=Decimal(str(d["discountTotal"]))
          assert discount == (subtotal * Decimal("0.10")).quantize(Decimal("0.0001")), d
          a=d["adjustments"][0]
          assert a["presetNameSnapshot"] == "CI Loyalty 10%", a
          print("Preset application smoke passed", subtotal, discount)
          PY

          RAW_STATUS=$(curl -sS -o /tmp/raw.json -w '%{http_code}' -X PUT "http://127.0.0.1:8180/api/v1/orders/$ORDER_ID/discount" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"mode":"PERCENT","value":99,"reason":"unsafe"}')
          test "$RAW_STATUS" = "403"

          kill "$NODE_PID" || true

  backoffice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/backoffice/package-lock.json
      - name: Install
        working-directory: apps/backoffice
        run: npm ci
      - name: Build
        working-directory: apps/backoffice
        run: npm run build

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get dependencies
        working-directory: apps/pos-template
        run: flutter pub get
      - name: Format
        working-directory: apps/pos-template
        run: dart format lib
      - name: Analyze
        working-directory: apps/pos-template
        run: flutter analyze --no-fatal-infos
