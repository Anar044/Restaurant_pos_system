name: Discounts and service check

on:
  push:
    branches:
      - feature/discounts-service-charge-v1

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: restaurant_local
          POSTGRES_USER: restaurant
          POSTGRES_PASSWORD: restaurant_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurant -d restaurant_local"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Restore backend
        run: dotnet restore services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj

      - name: Generate order adjustments migration
        shell: bash
        run: |
          if ! grep -R -q 'class AddOrderAdjustments' services/restaurant-node/src/RestaurantNode.Api/Infrastructure/Migrations/*.cs; then
            dotnet ef migrations add AddOrderAdjustments \
              --project services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj \
              --startup-project services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj \
              --output-dir Infrastructure/Migrations

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/restaurant-node/src/RestaurantNode.Api/Infrastructure/Migrations
            git commit -m "Generate order adjustments migration"
            git push
          fi

      - name: Build Restaurant Node
        run: dotnet build services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj --no-restore

      - name: Verify EF model clean
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj \
            --startup-project services/restaurant-node/src/RestaurantNode.Api/RestaurantNode.Api.csproj

      - name: Build POS Agent
        run: dotnet build services/pos-agent/src/PosAgent.Api/PosAgent.Api.csproj

      - name: Runtime smoke test
        shell: bash
        env:
          ConnectionStrings__RestaurantDb: Host=127.0.0.1;Port=5432;Database=restaurant_local;Username=restaurant;Password=restaurant_dev_password
          Jwt__Key: restaurant-pos-development-jwt-key-change-me-2026-123456789
          Seed__AdminPin: "1234"
          Agent__SharedKey: restaurant-pos-agent-local-dev-key-2026
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:8180
        run: |
          set -o pipefail
          cd services/restaurant-node/src/RestaurantNode.Api
          dotnet run --no-build --no-launch-profile > /tmp/restaurant-node.log 2>&1 &
          NODE_PID=$!

          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8180/health; then
              ok=1
              break
            fi

            if ! kill -0 "$NODE_PID" 2>/dev/null; then
              break
            fi

            sleep 1
          done

          echo
          echo "===== Restaurant Node log ====="
          cat /tmp/restaurant-node.log || true

          if [ "$ok" -ne 1 ]; then
            exit 1
          fi

          AUTH_JSON=$(curl -fsS -X POST http://127.0.0.1:8180/api/v1/auth/pin \
            -H 'Content-Type: application/json' \
            -d '{"restaurantId":"11111111-1111-1111-1111-111111111111","pin":"1234"}')
          TOKEN=$(printf '%s' "$AUTH_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')

          MENU_JSON=$(curl -fsS http://127.0.0.1:8180/api/v1/menu \
            -H "Authorization: Bearer $TOKEN")
          PRODUCT_ID=$(printf '%s' "$MENU_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["id"] for c in d["categories"] for p in c["products"]))')

          ORDER_JSON=$(curl -fsS -X POST http://127.0.0.1:8180/api/v1/orders \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"guestCount":2}')
          ORDER_ID=$(printf '%s' "$ORDER_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          curl -fsS -X POST "http://127.0.0.1:8180/api/v1/orders/$ORDER_ID/items" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"productId\":\"$PRODUCT_ID\",\"quantity\":2,\"guestNumber\":1}" >/tmp/order.json

          curl -fsS -X POST "http://127.0.0.1:8180/api/v1/orders/$ORDER_ID/items" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"productId\":\"$PRODUCT_ID\",\"quantity\":1,\"guestNumber\":2}" >/tmp/order.json

          curl -fsS -X PUT "http://127.0.0.1:8180/api/v1/orders/$ORDER_ID/discount" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"mode":"PERCENT","value":10,"reason":"CI guest discount","guestNumber":1}' >/tmp/order.json

          curl -fsS -X PUT "http://127.0.0.1:8180/api/v1/orders/$ORDER_ID/discount" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"mode":"FIXED","value":1,"reason":"CI order discount"}' >/tmp/order.json

          curl -fsS -X PUT "http://127.0.0.1:8180/api/v1/orders/$ORDER_ID/service-charge" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"mode":"PERCENT","value":10,"reason":"CI service"}' >/tmp/order.json

          python3 - <<'PY'
          import json
          from decimal import Decimal

          with open("/tmp/order.json", encoding="utf-8") as f:
              order = json.load(f)

          subtotal = Decimal(str(order["subtotal"]))
          discount = Decimal(str(order["discountTotal"]))
          surcharge = Decimal(str(order["surchargeTotal"]))
          total = Decimal(str(order["total"]))
          adjustment_count = len(order.get("adjustments", []))
          guest_total = sum(
              Decimal(str(row["total"]))
              for row in order.get("guestBalances", [])
          )

          assert subtotal > 0, order
          assert discount > 0, order
          assert surcharge > 0, order
          assert adjustment_count == 3, order
          assert abs(total - (subtotal - discount + surcharge)) <= Decimal("0.0001"), order
          assert abs(total - guest_total) <= Decimal("0.0001"), order
          print("Pricing integration smoke passed:", {
              "subtotal": str(subtotal),
              "discount": str(discount),
              "surcharge": str(surcharge),
              "total": str(total),
          })
          PY

          kill "$NODE_PID" || true

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        working-directory: apps/pos-template
        run: flutter pub get

      - name: Format
        working-directory: apps/pos-template
        run: dart format lib

      - name: Analyze
        working-directory: apps/pos-template
        run: flutter analyze --no-fatal-infos
